function hundredProgress(n){var hundreds=Math.floor(n/100),rest=n%100;if(!n)return"0 / 100";if(rest===0)return n+"점 = "+hundreds+"개의 100";if(n<100)return n+"점 · 100까지 "+(100-n)+"점";return n+"점 = "+hundreds+"개의 100 + "+rest}

function scoreLearning(n){n=Math.min(100,n||0);if(n===100)return"100 완성!";return"100까지 "+(100-n)+"점"}function diffText(now,prev,isTime){if(prev===undefined||!prev)return"";var d=isTime?Math.round(Math.abs(now-prev)/1000):Math.abs(now-prev);if(!d)return"이전 기록과 같아요";return isTime?"이전보다 "+d+"초 "+(now<prev?"빨라요":"느려요"):"이전보다 "+neatScore(d)+"점 "+(now>prev?"높아요":"낮아요")}function tenBar(n){n=Math.max(0,Math.min(100,n||0));var k=Math.round(n/10),x='<div class="tenbar">';for(var i=0;i<10;i++)x+='<i class="'+(i<k?'on':'')+'"></i>';return x+'</div>'}

function oneCompare(label,now,other){

("home").onclick=home;document.getElementById("gameResetTop").onclick=function(){gameResetMenu(g)}}function gameResetMenu(g){A.innerHTML='<div class="panel"><h1>🗑️ '+gn[g]+' 기록 리셋</h1><p class="lead">이 게임의 기록만 지웁니다.<br>다른 게임 기록은 그대로 남아요.</p><button class="soft reset" id="gc">👧 아이의 이 게임 기록</button><button class="soft reset" id="gm">👩 엄마의 이 게임 기록</button><button class="soft reset" id="ga">🏠 이 게임 전체 기록</button><br><button class="go" id="gb">취소</button></div>';document.getElementById("gc").onclick=function(){confirmGameReset(g,"child")};document.getElementById("gm").onclick=function(){confirmGameReset(g,"mom")};document.getElementById("ga").onclick=function(){confirmGameReset(g,"all")};document.getElementById("gb").onclick=function(){intro(g)}}
